<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Die Harmonie der Bibel - 63.779 Querverweise</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- Top Control Panel -->
        <header id="control-panel">
            <div class="control-group">
                <label for="book-filter" data-i18n="book">Buch:</label>
                <select id="book-filter">
                    <option value="all" data-i18n="allBooks">Alle Bücher</option>
                </select>
            </div>
            <div class="control-group">
                <label for="distance-filter" data-i18n="distance">Distanz (Kapitel):</label>
                <input type="range" id="distance-filter" min="0" max="1189" value="1189">
                <span id="distance-value">1189</span>
            </div>
            <div class="control-group filter-buttons" id="testament-filters">
                <button data-filter="all" class="active" data-i18n="allTestaments">Alle</button>
                <button data-filter="ot" data-i18n="onlyOT">Nur AT</button>
                <button data-filter="nt" data-i18n="onlyNT">Nur NT</button>
                <button data-filter="cross" data-i18n="crossTestament">AT ↔ NT</button>
            </div>
            <div class="control-group filter-buttons" id="group-filters">
                <select id="group-filter">
                    <option value="all" data-i18n="allGroups">Alle Gruppen</option>
                <option value="Tora" data-i18n="tora">Tora</option>
                    <option value="Historische Bücher" data-i18n="historical">Historische Bücher</option>
                    <option value="Poetische Bücher" data-i18n="poetic">Poetische Bücher</option>
                    <option value="Propheten" data-i18n="prophets">Propheten</option>
                    <option value="Evangelien" data-i18n="gospels">Evangelien</option>
                    <option value="Briefe" data-i18n="letters">Briefe</option>
                    <option value="Offenbarung" data-i18n="revelation">Offenbarung</option>
                </select>
            </div>
            <div class="control-group">
                <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Suchen (z.B. Joh 3)">
                <span id="search-error" class="error-text hidden"></span>
            </div>
            <div class="control-group">
                <button id="reset-zoom" data-i18n="resetZoom">Zoom zurücksetzen</button>
                <button id="reset-selection" data-i18n="resetSelection">Auswahl aufheben</button>
            </div>
            <div class="control-group">
                <select id="lang-select">
                    <option value="de">DE</option>
                    <option value="en">EN</option>
                    <option value="it">IT</option>
                    <option value="fr">FR</option>
                </select>
            </div>
            <div class="control-group">
                <button id="update-data" data-i18n="dataSource">Datenquelle</button>
            </div>
            <div class="control-group">
                <select id="view-mode-select">
                    <option value="arc" data-i18n="viewArc">Bögen (Arc)</option>
                    <option value="matrix" data-i18n="viewMatrix">Matrix (Heatmap)</option>
                    <option value="chord" data-i18n="viewChord">Chord (Kreis)</option>
                    <option value="map" data-i18n="viewMap">Karte (Geo)</option>
                </select>
            </div>
        </header>

        <!-- Main Visualization Area -->
        <main id="viz-container">
            <!-- Loading Indicator -->
            <div id="loading-overlay">
                <div class="spinner"></div>
                <div id="loading-text" data-i18n="loading">Lade Daten (0%)...</div>
            </div>

            <!-- Tooltip -->
            <div id="tooltip" class="hidden"></div>

            <!-- Legend -->
            <div id="legend">
                <div class="legend-gradient"></div>
                <div class="legend-labels">
                    <span data-i18n="legendNear">Nah</span>
                    <span data-i18n="legendFar">Weit</span>
                </div>
            </div>

            <!-- Canvas wrapper -->
            <div id="canvas-wrapper">
                <canvas id="viz-canvas"></canvas>
            </div>
        <!-- Sidebar Statistics -->
        <aside id="sidebar" class="collapsed">
            <div class="sidebar-toggle" id="sidebar-toggle">◀</div>
            <div class="sidebar-content">
                <h2>Statistik</h2>
                <div class="stat-box">
                    <div class="stat-label">Sichtbare Querverweise</div>
                    <div class="stat-value" id="stat-visible-arcs">0</div>
                </div>

                <div class="accordion">
                    <div class="accordion-item" id="acc-stats">
                        <div class="accordion-header" id="acc-stats-header">Diagramme <span>▼</span></div>
                        <div class="accordion-body">
                            <div class="stat-section">
                                <h3>Verteilung</h3>
                                <div id="donut-chart"></div>
                            </div>
                            <div class="stat-section">
                                <h3>Top 10 Bücher</h3>
                                <div id="top-books-chart"></div>
                            </div>
                            <div class="stat-section">
                                <h3>Top 10 Kapitel</h3>
                                <div id="top-chapters-chart"></div>
                            </div>
                        </div>
                    </div>
                    <div class="accordion-item" id="acc-details">
                        <div class="accordion-header" id="acc-details-header"><span data-i18n="chapterDetailsTitle">Kapitel Details</span> <span>▼</span></div>
                        <div class="accordion-body hidden" id="acc-details-body">
                            <div class="chapter-details" id="chapter-details">
                                <div id="chapter-info"></div>
                                <div id="chapter-text" class="bible-text-box"></div>
                                <ul id="chapter-links-list"></ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>
        </main>
    </div>

    <!-- Scripts -->
    <script src="js/dataLoader.js"></script>
    <script src="js/api.js"></script>
    <script src="js/search.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
